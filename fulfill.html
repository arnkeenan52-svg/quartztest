<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#273071" />
  <title>Click & Collect – Quartz Mølle</title>
  <link rel="icon" href="images/logo-small.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { background: var(--cream, #f5f1e8); color: #1a1611; font-family: 'Inter', system-ui, sans-serif; margin: 0; }
    .wrap { max-width: 920px; margin: 0 auto; padding: 3.5rem 1.25rem 5rem; }
    .head { text-align: center; margin-bottom: 2rem; }
    .head img { width: 56px; height: 56px; border-radius: 50%; }
    .head h1 { font-size: 1.6rem; font-weight: 700; margin: 0.75rem 0 0.25rem; color: #273071; }
    .head p { color: #666; margin: 0; font-size: 0.95rem; }

    .login { max-width: 340px; margin: 3rem auto 0; background: #fff; border-radius: 16px; padding: 1.75rem; box-shadow: 0 6px 28px rgba(0,0,0,0.08); }
    .login label { display: block; font-size: 0.8rem; font-weight: 600; color: #555; margin-bottom: 0.4rem; }
    .login input { width: 100%; padding: 0.8rem 0.9rem; border: 1px solid #d9d4c7; border-radius: 9px; font-size: 1rem; font-family: inherit; box-sizing: border-box; }
    .btn { background: #273071; color: #fff; border: none; border-radius: 999px; padding: 0.7rem 1.3rem; font-family: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.15s, opacity 0.15s; }
    .btn:hover:not(:disabled) { background: #1b2252; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-block { width: 100%; margin-top: 1rem; }
    .login-err { color: #c62828; font-size: 0.85rem; min-height: 1.1rem; margin-top: 0.6rem; }

    .hide { display: none !important; }

    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.25rem; }
    .section-title { font-size: 0.78rem; letter-spacing: 0.16em; text-transform: uppercase; color: #888; margin: 2rem 0 0.9rem; border-bottom: 2px solid #273071; padding-bottom: 0.5rem; }

    .codes { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .code-chip { background: #fff; border: 1px solid #e0d9c8; border-radius: 10px; padding: 0.55rem 0.85rem; font-size: 0.9rem; }
    .code-chip b { color: #273071; }

    .order { background: #fff; border-radius: 14px; padding: 1.1rem 1.25rem; box-shadow: 0 3px 16px rgba(0,0,0,0.06); margin-bottom: 0.9rem; }
    .order.done { opacity: 0.7; }
    .order-top { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .order-who { font-weight: 600; color: #1a1611; }
    .order-email { color: #273071; font-size: 0.9rem; word-break: break-all; }
    .order-ref { font-size: 0.8rem; color: #999; letter-spacing: 0.04em; }
    .order-items { font-size: 0.85rem; color: #666; margin-top: 0.5rem; }
    .order-actions { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.9rem; flex-wrap: wrap; }
    .order-actions input { width: 110px; padding: 0.6rem 0.7rem; border: 1px solid #d9d4c7; border-radius: 9px; font-size: 0.95rem; font-family: inherit; }
    .order-status { font-size: 0.88rem; font-weight: 600; }
    .order-status.ok { color: #2e7d32; }
    .order-status.err { color: #c62828; }
    .empty { color: #999; font-size: 0.92rem; padding: 0.5rem 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <img src="images/logopng.png" alt="Quartz Mølle" />
      <h1>Click & Collect ordrer</h1>
      <p>Send skab-kode til kunder der har valgt afhentning</p>
    </div>

    <!-- LOGIN -->
    <div class="login" id="login">
      <label for="pw">Kodeord</label>
      <input type="password" id="pw" autocomplete="current-password" />
      <div class="login-err" id="loginErr"></div>
      <button class="btn btn-block" id="loginBtn">Log ind</button>
    </div>

    <!-- APP -->
    <div id="app" class="hide">
      <div class="toolbar">
        <button class="btn" id="refreshBtn" style="background:#fff;color:#273071;border:1px solid #d9d4c7;">Opdater</button>
        <span class="lang-spacer"></span>
      </div>

      <div class="section-title">Aktive skab-koder</div>
      <div class="codes" id="codes"></div>

      <div class="section-title">Afventende ordrer</div>
      <div id="pending"></div>

      <div class="section-title">Afsendte ordrer</div>
      <div id="done"></div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script>
  (function () {
    var AUTH_KEY = 'qm_admin_auth';
    var loginEl = document.getElementById('login');
    var appEl = document.getElementById('app');

    function authHeader() {
      var a = sessionStorage.getItem(AUTH_KEY);
      return a ? { 'Authorization': 'Basic ' + a } : {};
    }
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
      });
    }

    document.getElementById('loginBtn').addEventListener('click', doLogin);
    document.getElementById('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
    document.getElementById('refreshBtn').addEventListener('click', load);

    function doLogin() {
      var pw = document.getElementById('pw').value;
      var token = btoa('fintankeenan:' + pw);
      sessionStorage.setItem(AUTH_KEY, token);
      load(true);
    }

    function showApp() { loginEl.classList.add('hide'); appEl.classList.remove('hide'); }

    async function load(fromLogin) {
      try {
        var res = await fetch('/api/fulfill?action=list', { headers: authHeader() });
        if (res.status === 401) {
          sessionStorage.removeItem(AUTH_KEY);
          if (fromLogin) document.getElementById('loginErr').textContent = 'Forkert kode';
          loginEl.classList.remove('hide'); appEl.classList.add('hide');
          return;
        }
        var data = await res.json();
        if (!data.ok) return;
        showApp();
        render(data);
      } catch (e) {
        if (fromLogin) document.getElementById('loginErr').textContent = 'Netværksfejl';
      }
    }

    function render(data) {
      var fulfilled = data.fulfilled || {};
      // Active codes
      var codesEl = document.getElementById('codes');
      var lockers = data.lockers || [];
      codesEl.innerHTML = lockers.length
        ? lockers.map(function (l) { return '<div class="code-chip">Dør <b>' + l.door + '</b> · Kode <b>' + escapeHtml(l.code) + '</b></div>'; }).join('')
        : '<div class="empty">Ingen aktive koder.</div>';

      var orders = data.orders || [];
      var pending = orders.filter(function (o) { return o && !fulfilled[o.ref]; });
      var done = orders.filter(function (o) { return o && fulfilled[o.ref]; });

      var pendingEl = document.getElementById('pending');
      pendingEl.innerHTML = pending.length ? '' : '<div class="empty">Ingen afventende ordrer.</div>';
      pending.forEach(function (o) { pendingEl.appendChild(orderCard(o, null)); });

      var doneEl = document.getElementById('done');
      doneEl.innerHTML = done.length ? '' : '<div class="empty">Ingen afsendte ordrer.</div>';
      done.forEach(function (o) { doneEl.appendChild(orderCard(o, fulfilled[o.ref])); });
    }

    function itemsLine(o) {
      var items = o.items || [];
      if (!items.length) return '';
      return items.map(function (it) {
        return escapeHtml(it.name) + (it.weightLabel ? ' (' + escapeHtml(it.weightLabel) + ')' : '') + ' × ' + (it.qty || 1);
      }).join(', ');
    }

    function orderCard(o, sent) {
      var card = document.createElement('div');
      card.className = 'order' + (sent ? ' done' : '');
      var total = Number(o.total || 0).toFixed(2).replace('.', ',');
      var html = '' +
        '<div class="order-top">' +
          '<div>' +
            '<div class="order-who">' + escapeHtml(o.name) + '</div>' +
            '<div class="order-email">' + escapeHtml(o.email) + '</div>' +
          '</div>' +
          '<div style="text-align:right;">' +
            '<div class="order-ref">Ordre #' + escapeHtml(o.ref) + '</div>' +
            '<div style="font-weight:700;color:#273071;">' + total + ' kr.</div>' +
          '</div>' +
        '</div>' +
        '<div class="order-items">' + itemsLine(o) + '</div>';

      if (sent) {
        html += '<div class="order-actions"><span class="order-status ok">Sendt · Dør ' + escapeHtml(sent.door) + ' · Kode ' + escapeHtml(sent.code) + '</span></div>';
        card.innerHTML = html;
        return card;
      }

      html += '<div class="order-actions">' +
          '<input type="number" min="1" placeholder="Skab-/dør-nummer" />' +
          '<button class="btn">Send kode til kunde</button>' +
          '<span class="order-status"></span>' +
        '</div>';
      card.innerHTML = html;

      var input = card.querySelector('input');
      var btn = card.querySelector('button');
      var status = card.querySelector('.order-status');
      btn.addEventListener('click', async function () {
        var door = parseInt(input.value, 10);
        status.className = 'order-status';
        if (!(door >= 1)) { status.classList.add('err'); status.textContent = 'Skriv et skab-/dør-nummer først.'; return; }
        btn.disabled = true; var orig = btn.textContent; btn.textContent = 'Sender…';
        try {
          var res = await fetch('/api/fulfill', {
            method: 'POST',
            headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
            body: JSON.stringify({ action: 'send', ref: o.ref, door: door })
          });
          var data = await res.json();
          if (res.ok && data.ok) {
            status.classList.add('ok'); status.textContent = 'Sendt!';
            setTimeout(load, 600);
          } else {
            status.classList.add('err');
            status.textContent = data.error || 'Kunne ikke sende. Prøv igen.';
            btn.disabled = false; btn.textContent = orig;
          }
        } catch (e) {
          status.classList.add('err'); status.textContent = 'Kunne ikke sende. Prøv igen.';
          btn.disabled = false; btn.textContent = orig;
        }
      });
      return card;
    }

    // Auto-login if already authed (shared with /admin)
    if (sessionStorage.getItem(AUTH_KEY)) load();
  })();
  </script>
</body>
</html>
