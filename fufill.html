<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Ordre-fulfillment · Quartz Mølle</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="apple-touch-icon" href="/images/appletouchicon.png">
<meta name="apple-mobile-web-app-title" content="Quartz Mølle">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* =========================================================================
     Design system: structure, neutrals, radii and shadow scale adapted from
     21st.dev's "Harbor Blue" theme (serafimcloud); the primary colour stays
     Quartz Mølle's brand blue. Only the styling is new — the cabinet skeleton
     and every JS hook are unchanged.
     ========================================================================= */
  :root{
    --bg:#f8fafc; --surface:#fff; --surface-2:#f8fafc;
    --fg:#0f172a; --fg-2:#334155; --muted:#f1f5f9; --muted-fg:#64748b; --subtle-fg:#94a3b8;
    --border:#e2e8f0; --border-strong:#cbd5e1;

    --primary:#273071; --primary-hover:#313c8c; --primary-fg:#fff;
    --primary-tint:#eef1fa; --primary-ring:rgba(39,48,113,.28);

    --green:#15803d; --green-tint:#f0fdf4; --green-border:#bbf7d0;
    --red:#dc2626;   --red-tint:#fef2f2;   --red-border:#fecaca;
    --amber:#b45309; --amber-tint:#fffbeb;

    --radius:8px; --radius-lg:10px; --radius-sm:6px;
    --sh-xs:0 1px 2px rgba(15,23,42,.06);
    --sh-sm:0 1px 3px rgba(15,23,42,.08);
    --sh:0 2px 10px rgba(15,23,42,.10);
    --sh-lg:0 12px 32px rgba(15,23,42,.16);

    /* legacy aliases still referenced by inline styles/JS */
    --blue:var(--primary); --blue-dark:#1b2252; --blue-light:#3a4599;
    --cream:var(--bg); --line:var(--border); --text:var(--fg); --white:#fff;
    --grey:var(--subtle-fg); --grey-soft:var(--muted); --red-soft:var(--red-border);
    --green-soft:var(--green-tint); --shadow:var(--sh);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;
    line-height:1.5;font-size:14px;font-weight:500;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .hide{display:none!important}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- LOGIN ---------- */
  #login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
  .login-card{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    box-shadow:var(--sh);padding:32px 28px;width:100%;max-width:360px;text-align:center
  }
  .login-card img{width:64px;height:64px;object-fit:contain;margin-bottom:16px}
  .login-card h1{font-size:18px;font-weight:700;color:var(--fg);letter-spacing:-.01em}
  .login-card p{color:var(--muted-fg);font-size:13.5px;font-weight:500;margin-top:6px;margin-bottom:22px}
  .code-input{
    width:100%;text-align:center;font-size:26px;font-weight:600;letter-spacing:8px;
    color:var(--fg);padding:14px;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);outline:none;font-variant-numeric:tabular-nums;
    transition:border-color .15s ease,box-shadow .15s ease
  }
  .code-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
  .login-btn{
    width:100%;margin-top:14px;background:var(--primary);color:var(--primary-fg);
    font-size:15px;font-weight:600;padding:12px;border-radius:var(--radius);
    transition:background-color .15s ease
  }
  .login-btn:hover{background:var(--primary-hover)}
  .login-err{color:var(--red);font-size:13.5px;font-weight:500;margin-top:14px;min-height:18px}

  /* ---------- TOP BAR ---------- */
  .top{
    position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
    padding:0 16px;height:56px;background:var(--surface);
    border-bottom:1px solid var(--border);
    padding-top:env(safe-area-inset-top,0)
  }
  .top img{width:28px;height:28px;object-fit:contain;border-radius:6px;flex:none}
  .ttl{font-size:14.5px;font-weight:700;color:var(--fg);letter-spacing:-.01em;line-height:1.2;
    min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ttl small{display:block;font-size:11.5px;font-weight:500;color:var(--muted-fg);letter-spacing:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spacer{flex:1}
  .pill{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    color:var(--muted-fg);background:var(--muted);border:1px solid var(--border);
    padding:5px 10px;border-radius:999px;white-space:nowrap
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--subtle-fg);flex:none}
  .pill.online{color:var(--green);background:var(--green-tint);border-color:var(--green-border)}
  .pill.online .dot{background:var(--green)}
  .logout{
    font-size:13px;font-weight:600;color:var(--fg-2);padding:7px 11px;border-radius:var(--radius-sm);white-space:nowrap;flex:none;
    border:1px solid var(--border);background:var(--surface);
    transition:background-color .15s ease,border-color .15s ease
  }
  .logout:hover{background:var(--muted);border-color:var(--border-strong)}

  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 56px}

  /* ---------- PANELS ---------- */
  .panel{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    box-shadow:var(--sh-xs);margin-bottom:16px;overflow:hidden
  }
  .panel-h{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface-2)
  }
  .panel-h h2{
    font-size:11px;font-weight:700;color:var(--muted-fg);
    text-transform:uppercase;letter-spacing:.06em
  }
  .panel-meta{font-size:13px;font-weight:500;color:var(--muted-fg);font-variant-numeric:tabular-nums;text-align:right}
  .panel-meta b{color:var(--fg);font-weight:700}
  .panel-b{padding:16px}

  /* ---------- BUTTONS ---------- */
  .btn{
    border-radius:var(--radius);font-size:14px;font-weight:600;padding:10px 14px;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    border:1px solid transparent;min-height:40px;white-space:nowrap;
    transition:background-color .15s ease,border-color .15s ease,color .15s ease;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;text-decoration:none
  }
  .btn-primary{background:var(--green);color:#fff;box-shadow:var(--sh-xs)}
  .btn-primary:hover{background:#166534}
  .btn-blue{background:var(--primary);color:var(--primary-fg);box-shadow:var(--sh-xs)}
  .btn-blue:hover{background:var(--primary-hover)}
  .btn-ghost{background:var(--surface);color:var(--fg-2);border-color:var(--border);box-shadow:var(--sh-xs)}
  .btn-ghost:hover{background:var(--muted);border-color:var(--border-strong)}
  .btn-grow{flex:1}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}


  /* Language switcher (injected by i18n.js) — recoloured for this light top bar. */
  .top .lang-switch-btn{
    display:inline-flex;align-items:center;gap:5px;
    color:var(--fg-2)!important;background:var(--surface)!important;
    border:1px solid var(--border)!important;border-radius:var(--radius-sm)!important;
    padding:7px 9px!important;font-size:13px!important;font-weight:500!important;box-shadow:none!important
  }
  .top .lang-switch-btn:hover{background:var(--muted)!important;border-color:var(--border-strong)!important}
  .top .lang-switch-btn svg,.top .lang-chevron{color:var(--muted-fg)!important;opacity:1}
  .top .lang-switch-menu{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--sh-lg);color:var(--fg)
  }

  /* ---------- SECTION NAV ---------- */
  .subnav{
    display:flex;gap:2px;padding:0 16px;background:var(--surface);
    border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;
    position:sticky;top:56px;z-index:39
  }
  .subnav::-webkit-scrollbar{display:none}
  .subnav-item{
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
    padding:11px 10px;font-size:13px;font-weight:600;color:var(--muted-fg);
    text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;
    transition:color .15s ease,border-color .15s ease
  }
  .subnav-item svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .subnav-item:hover{color:var(--fg)}
  .subnav-item.is-active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}

  /* ---------- ICONS ---------- */
  .btn .ic,.icon-btn svg,.search-clear .ic{
    width:16px;height:16px;fill:none;stroke:currentColor;
    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none
  }
  .search-clear .ic{width:15px;height:15px}
  .icon-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:32px;height:32px;border-radius:var(--radius-sm);color:var(--muted-fg);
    border:1px solid var(--border);background:var(--surface);
    transition:background-color .15s ease,color .15s ease,border-color .15s ease
  }
  .icon-btn:hover{background:var(--muted);color:var(--fg);border-color:var(--border-strong)}

  .sec-h{margin:22px 2px 10px;font-size:11px;font-weight:700;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.06em}
  .empty{color:var(--muted-fg);font-weight:500;font-size:13.5px;padding:4px 0}

  /* ---------- ACTIVE LOCKER CODES ---------- */
  .codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
  .codechip{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:10px 12px;box-shadow:var(--sh-xs)
  }
  .codechip .d{font-size:11px;font-weight:600;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.05em}
  .codechip .c{font-size:20px;font-weight:700;color:var(--primary);letter-spacing:1px;margin-top:3px;font-variant-numeric:tabular-nums}

  /* ---------- SEARCH ---------- */
  .search-wrap{position:relative;margin:0 0 16px}
  .search-in{
    width:100%;padding:10px 38px;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);font-size:16px;font-family:inherit;color:var(--fg);outline:none;min-height:42px;
    box-shadow:var(--sh-xs);transition:border-color .15s ease,box-shadow .15s ease
  }
  .search-in::placeholder{color:var(--subtle-fg)}
  .search-in:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
  .search-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--subtle-fg);pointer-events:none;display:flex}
  .search-ic svg{width:17px;height:17px}
  .search-clear{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);display:none;
    align-items:center;justify-content:center;width:26px;height:26px;border-radius:var(--radius-sm);
    color:var(--muted-fg);font-size:13px;background:transparent;transition:background-color .15s ease
  }
  .search-clear:hover{background:var(--muted)}
  .search-clear.show{display:flex}

  /* ---------- ORDER CARDS ---------- */
  .order{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;margin-bottom:10px;box-shadow:var(--sh-xs)
  }
  .order:last-child{margin-bottom:0}
  .order.done{background:var(--surface-2);opacity:.85}
  .order-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
  .order-who{font-weight:700;font-size:14.5px;color:var(--fg);letter-spacing:-.01em}
  .order-email{color:var(--muted-fg);font-weight:500;font-size:13px;word-break:break-all;margin-top:1px}
  .order-ref{font-size:11px;font-weight:600;color:var(--subtle-fg);letter-spacing:.05em;text-align:right;font-variant-numeric:tabular-nums;text-transform:uppercase}
  .order-total{font-weight:700;color:var(--fg);font-size:14.5px;font-variant-numeric:tabular-nums}
  .order-items{font-size:13px;font-weight:500;color:var(--muted-fg);margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
  .order-act{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .door-in{
    width:132px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);font-size:16px;font-weight:500;color:var(--fg);outline:none;
    font-family:inherit;min-height:40px;font-weight:600;font-variant-numeric:tabular-nums;
    transition:border-color .15s ease,box-shadow .15s ease
  }
  .door-in::placeholder{font-size:13px;font-weight:400;color:var(--subtle-fg)}
  .door-in:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
  .send-btn{background:var(--primary);color:var(--primary-fg)}
  .send-btn:hover{background:var(--primary-hover)}
  .order-status{font-size:13px;font-weight:600;color:var(--muted-fg)}
  .order-status.ok{color:var(--green)} .order-status.err{color:var(--red)}
  .sent-line{
    margin-top:10px;font-weight:600;color:var(--green);font-size:13px;
    background:var(--green-tint);border:1px solid var(--green-border);
    border-radius:var(--radius-sm);padding:8px 10px
  }
  .order-foot{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  .btn-print{font-size:13px;padding:8px 12px;min-height:36px}
  .btn-del{font-size:13px;padding:8px 12px;min-height:36px;color:var(--red);border-color:var(--red-border)}
  .btn-del:hover{background:var(--red-tint);border-color:var(--red)}
  .btn-del.arm{background:var(--red);color:#fff;border-color:var(--red)}
  .btn-del.arm:hover{background:#b91c1c}

  @media (max-width:430px){
    .wrap{padding:16px 12px 48px}
    .panel-b{padding:12px}
    .panel-h{padding:11px 12px}
    .btn{font-size:13.5px;padding:10px 11px;gap:6px}
    .top{gap:8px;padding:0 12px}
    .top img{width:26px;height:26px}
    .ttl{font-size:13.5px}
    .ttl small{font-size:11px}
    .logout{font-size:12px;padding:6px 9px}
    .top .lang-switch-btn{padding:6px 7px!important;font-size:12px!important}
    .door-in{width:110px}
    .subnav{padding:0 8px}
    .subnav-item{padding:10px 8px;font-size:12.5px}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition-duration:.01ms!important;animation-duration:.01ms!important}
  }
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login">
  <div class="login-card">
    <img src="/images/logopng.png" alt="Quartz Mølle" onerror="this.style.display='none'">
    <h1>Ordre-fulfillment</h1>
    <p>Indtast adgangskode</p>
    <input id="codeInput" class="code-input" type="password" inputmode="numeric"
           autocomplete="off" maxlength="10" placeholder="••••">
    <button id="loginBtn" class="login-btn">Lås op</button>
    <div id="loginErr" class="login-err"></div>
  </div>
</div>

<!-- ===== DASHBOARD ===== -->
<div id="app" class="hide">
  <div class="top">
    <img src="/images/logopng.png" alt="" onerror="this.style.display='none'">
    <div class="ttl">Ordre-fulfillment<small>Click &amp; Collect · Quartz Mølle</small></div>
    <div class="spacer"></div>
    <div data-lang-slot></div>
    <button class="logout" id="logoutBtn">Log ud</button>
  </div>

  <nav class="subnav" aria-label="Sektioner">
    <a class="subnav-item" href="/locker"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Skabe</a>
    <a class="subnav-item is-active" href="/fufill" aria-current="page"><svg viewBox="0 0 24 24"><path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg>Ordrer</a>
  </nav>

  <div class="wrap">
    <section class="panel">
      <header class="panel-h">
        <h2>Aktive skab-koder</h2>
        <button class="icon-btn" id="refreshBtn" aria-label="Opdatér" title="Opdatér">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </header>
      <div class="panel-b"><div class="codes" id="codes"></div></div>
    </section>

    <div class="search-wrap">
      <span class="search-ic">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
      </span>
      <input id="searchInput" class="search-in" type="text" autocomplete="off" placeholder="Søg efter navn eller e-mail…" />
      <button id="searchClear" class="search-clear" aria-label="Ryd søgning"><svg viewBox="0 0 24 24" class="ic"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>

    <section class="panel">
      <header class="panel-h"><h2>Afventende ordrer</h2></header>
      <div class="panel-b"><div id="pending"></div></div>
    </section>

    <section class="panel">
      <header class="panel-h"><h2>Afsendte ordrer</h2></header>
      <div class="panel-b"><div id="done"></div></div>
    </section>
  </div>
</div>

<script src="js/i18n.js"></script>
<script>
(function () {
  var loginEl = document.getElementById('login');
  var appEl = document.getElementById('app');
  var codeInput = document.getElementById('codeInput');
  var loginErr = document.getElementById('loginErr');

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  var searchInput = document.getElementById('searchInput');
  var searchClear = document.getElementById('searchClear');
  var lastData = null;     // keep the last loaded payload so search re-renders without a refetch
  var query = '';
  var TOTAL_DOORS = 22;
  var suggestedDoors = {}; // ref -> a free locker suggested for that pending order

  document.getElementById('loginBtn').addEventListener('click', doLogin);
  codeInput.addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  document.getElementById('refreshBtn').addEventListener('click', function(){ load(); });
  document.getElementById('logoutBtn').addEventListener('click', logout);

  searchInput.addEventListener('input', function(){
    query = searchInput.value.trim().toLowerCase();
    searchClear.classList.toggle('show', query.length > 0);
    if(lastData) render(lastData);
  });
  searchClear.addEventListener('click', function(){
    searchInput.value=''; query=''; searchClear.classList.remove('show');
    if(lastData) render(lastData);
    searchInput.focus();
  });

  async function doLogin(){
    loginErr.textContent='';
    var code = codeInput.value.trim();
    if(!code){ loginErr.textContent='Indtast kode'; return; }
    try{
      var r = await fetch('/api/locker', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'login', code:code}) });
      var d = await r.json().catch(function(){return {};});
      if(r.ok && d.ok){ codeInput.value=''; showApp(); load(); }
      else { loginErr.textContent = d.error || 'Forkert kode'; }
    }catch(e){ loginErr.textContent='Netværksfejl'; }
  }

  async function logout(){
    try{ await fetch('/api/locker', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'logout'}) }); }catch(e){}
    appEl.classList.add('hide'); loginEl.classList.remove('hide');
  }

  function showApp(){ loginEl.classList.add('hide'); appEl.classList.remove('hide'); }

  async function load(){
    try{
      var r = await fetch('/api/fulfill?action=list');
      if(r.status===401){ appEl.classList.add('hide'); loginEl.classList.remove('hide'); return; }
      var d = await r.json();
      if(!d.ok) return;
      showApp();
      render(d);
    }catch(e){}
  }

  function matchesQuery(o){
    if(!query) return true;
    var hay = ((o.name||'') + ' ' + (o.email||'') + ' ' + (o.ref||'')).toLowerCase();
    return hay.indexOf(query) !== -1;
  }

  function render(d){
    lastData = d;
    var fulfilled = d.fulfilled || {};
    var lockers = d.lockers || [];
    document.getElementById('codes').innerHTML = lockers.length
      ? lockers.map(function(l){ return '<div class="codechip"><div class="d">Dør '+l.door+'</div><div class="c">'+esc(l.code)+'</div></div>'; }).join('')
      : '<div class="empty">Ingen aktive koder.</div>';

    var orders = (d.orders || []).filter(matchesQuery);
    var pending = orders.filter(function(o){ return o && !fulfilled[o.ref]; });
    var done = orders.filter(function(o){ return o && fulfilled[o.ref]; });

    // Suggest a free locker for each pending order — never one that's occupied or
    // out of service, and never the same one twice. If we don't have live locker
    // state, assume all 22 doors are free.
    var freeDoors;
    if (lockers.length) {
      freeDoors = lockers.filter(function(l){ return !l.occ && !l.oos; })
                         .map(function(l){ return l.door; })
                         .sort(function(a,b){ return a-b; });
    } else {
      freeDoors = [];
      for (var i = 1; i <= TOTAL_DOORS; i++) freeDoors.push(i);
    }
    suggestedDoors = {};
    var fi = 0;
    pending.forEach(function(o){
      if (fi < freeDoors.length) suggestedDoors[o.ref] = freeDoors[fi++];
    });

    var pe = document.getElementById('pending');
    pe.innerHTML = pending.length ? '' : '<div class="empty">'+(query ? 'Ingen afventende ordrer matcher “'+esc(query)+'”.' : 'Ingen afventende ordrer.')+'</div>';
    pending.forEach(function(o){ pe.appendChild(card(o, null)); });

    var de = document.getElementById('done');
    de.innerHTML = done.length ? '' : '<div class="empty">'+(query ? 'Ingen afsendte ordrer matcher “'+esc(query)+'”.' : 'Ingen afsendte ordrer.')+'</div>';
    done.forEach(function(o){ de.appendChild(card(o, fulfilled[o.ref])); });
  }

  function itemsLine(o){
    return (o.items||[]).map(function(it){ return esc(it.name)+(it.weightLabel?' ('+esc(it.weightLabel)+')':'')+' × '+(it.qty||1); }).join(', ');
  }

  function sentText(sent){
    var slots = sent.slots || (sent.door!=null ? [{door:sent.door, code:sent.code}] : []);
    if(!slots.length) return 'Sendt';
    var codes = slots.map(function(s){return String(s.code);}).filter(function(v,i,a){return a.indexOf(v)===i;});
    if(slots.length===1) return 'Sendt · Dør '+esc(slots[0].door)+' · Kode '+esc(slots[0].code);
    if(codes.length===1) return 'Sendt · Døre '+slots.map(function(s){return esc(s.door);}).join(', ')+' · Kode '+esc(codes[0]);
    return 'Sendt · '+slots.map(function(s){return 'Dør '+esc(s.door)+' ('+esc(s.code)+')';}).join(', ');
  }

  function card(o, sent){
    var el = document.createElement('div');
    el.className = 'order' + (sent ? ' done' : '');
    var total = Number(o.total||0).toFixed(2).replace('.', ',');
    var html = ''
      + '<div class="order-top">'
      +   '<div><div class="order-who">'+esc(o.name)+'</div><div class="order-email">'+esc(o.email)+'</div></div>'
      +   '<div><div class="order-ref">Ordre #'+esc(o.ref)+'</div><div class="order-total">'+total+' kr.</div></div>'
      + '</div>'
      + '<div class="order-items">'+itemsLine(o)+'</div>';

    if(sent){
      html += '<div class="sent-line">'+sentText(sent)+'</div>';
    } else {
      html += '<div class="order-act">'
        + '<input class="door-in" type="text" inputmode="numeric" placeholder="Dør-nr. (fx 7, 8)" />'
        + '<button class="btn btn-blue send-btn">Send kode</button>'
        + '<span class="order-status"></span>'
        + '</div>';
    }

    // Order-confirmation print + delete buttons on every order
    html += '<div class="order-foot">'
      + '<button class="btn btn-ghost btn-print"><svg viewBox="0 0 24 24" class="ic"><path d="M6 9V2h12v7"/><rect x="6" y="14" width="12" height="8"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/></svg>Ordrebekræftelse</button>'
      + '<button class="btn btn-ghost btn-del"><svg viewBox="0 0 24 24" class="ic"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>Slet</button>'
      + '</div>';
    el.innerHTML = html;

    el.querySelector('.btn-print').addEventListener('click', function(){ printConfirmation(o, sent); });
    wireDelete(el.querySelector('.btn-del'), o.ref);

    if(!sent){
      var input = el.querySelector('.door-in');
      var btn = el.querySelector('.send-btn');
      var status = el.querySelector('.order-status');
      btn.addEventListener('click', async function(){
        var doorsVal = input.value.trim();
        status.className='order-status';
        if(!doorsVal){ status.classList.add('err'); status.textContent='Skriv et dør-nummer'; return; }
        btn.disabled=true; var t=btn.textContent; btn.textContent='Sender…';
        try{
          var r = await fetch('/api/fulfill', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'send', ref:o.ref, doors:doorsVal}) });
          var d = await r.json();
          if(r.ok && d.ok){ status.classList.add('ok'); status.textContent='Sendt!'; setTimeout(load, 600); }
          else { status.classList.add('err'); status.textContent = d.error || 'Kunne ikke sende'; btn.disabled=false; btn.textContent=t; }
        }catch(e){ status.classList.add('err'); status.textContent='Kunne ikke sende'; btn.disabled=false; btn.textContent=t; }
      });
    }
    return el;
  }

  // A super-simple, clean order confirmation. Prints via a hidden frame so the
  // print dialog opens on top of this page — no separate tab to get stuck on.
  function printConfirmation(o, sent){
    var total = Number(o.total||0).toFixed(2).replace('.', ',');
    var rows = (o.items||[]).map(function(it){
      return '<div class="it"><span class="n">'+esc(it.name)
        + (it.weightLabel?' <span class="wl">'+esc(it.weightLabel)+'</span>':'')
        + '</span><span class="q">'+(it.qty||1)+'×</span></div>';
    }).join('') || '<div class="it"><span class="n">—</span></div>';

    // Which locker to place this order in. For a sent order use the real door(s)
    // it was put in; for a pending one use the free-locker suggestion.
    var skabLabel = '', skabDoors = '';
    if (sent) {
      var slots = sent.slots || (sent.door!=null ? [{door:sent.door, code:sent.code}] : []);
      var doors = slots.map(function(s){ return s.door; }).filter(function(v,i,a){ return a.indexOf(v)===i; });
      if (doors.length) { skabLabel = doors.length>1 ? 'Skabe' : 'Skab'; skabDoors = doors.join(', '); }
    } else if (suggestedDoors[o.ref] != null) {
      skabLabel = 'Læg i skab'; skabDoors = String(suggestedDoors[o.ref]);
    }
    var skabHtml = skabDoors
      ? '<div class="skab"><span class="sl">'+skabLabel+'</span><span class="sn">'+esc(skabDoors)+'</span></div>'
      : '';

    var css =
      '@page{margin:0}' /* zero page margin = browser prints NO header/footer (no URL on the paper) */
      + '*{box-sizing:border-box;margin:0;padding:0}'
      + 'body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1a1611;background:#fff;padding:14mm 10mm}'
      + '.card{max-width:400px;margin:0 auto;padding:44px 34px;text-align:center}'
      + '.logo{width:66px;height:66px;object-fit:cover;border-radius:50%;margin:0 auto 14px;display:block}'
      + 'h1{font-size:20px;color:#273071;font-weight:800;letter-spacing:.2px}'
      + '.ref{font-size:13px;color:#9b9488;margin-top:4px}'
      + '.who{font-size:16px;font-weight:600;margin-top:14px}'
      + '.rule{height:1px;background:#e7e1d6;margin:22px 0}'
      + '.items{text-align:left}'
      + '.it{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #f0ece3;font-size:15px}'
      + '.it:last-child{border-bottom:none}'
      + '.it .n{font-weight:500}.it .wl{color:#9b9488;font-weight:400}'
      + '.it .q{font-weight:800;color:#273071;white-space:nowrap}'
      + '.total{display:flex;justify-content:space-between;font-size:18px;font-weight:800;color:#273071;margin-top:14px;padding-top:14px;border-top:2px solid #273071;text-align:left}'
      + '.skab{display:flex;align-items:center;justify-content:center;gap:14px;background:#273071;color:#fff;border-radius:14px;padding:16px 18px;margin:22px 0 4px}'
      + '.skab .sl{font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.85}'
      + '.skab .sn{font-size:34px;font-weight:800;line-height:1;letter-spacing:.5px}'
      + '.pickup{font-size:13px;color:#6b6256;margin-top:22px;line-height:1.6}'
      + '.pickup b{color:#1a1611}'
      + '.thanks{font-size:14px;font-weight:600;color:#273071;margin-top:22px}'
      + '.foot{font-size:11px;color:#9b9488;margin-top:10px;letter-spacing:.02em;line-height:1.6}';

    var docHtml = '<!doctype html><html lang="da"><head><meta charset="utf-8">'
      + '<title>Ordrebekræftelse #'+esc(o.ref)+'</title><style>'+css+'</style></head><body>'
      + '<div class="card">'
      +   '<img class="logo" src="/images/favicon.png" alt="" onerror="this.style.display=\'none\'">'
      +   '<h1>Ordrebekræftelse</h1>'
      +   '<div class="ref">Ordre #'+esc(o.ref)+'</div>'
      +   '<div class="who">'+esc(o.name||'—')+'</div>'
      +   '<div class="rule"></div>'
      +   '<div class="items">'+rows+'</div>'
      +   '<div class="total"><span>I alt</span><span>'+total+' kr.</span></div>'
      +   '<div class="pickup"><b>Afhentning</b><br>Suså Landevej 101, 4160 Herlufmagle</div>'
      +   '<div class="thanks">Tak for din ordre</div>'
      +   '<div class="foot">Quartz Mølle · CVR 42117188 · hello@quartzmolle.dk</div>'
      + '</div></body></html>';

    printViaFrame(docHtml);
  }

  // Print any HTML document via a hidden iframe (keeps you on the current page).
  function printViaFrame(docHtml){
    var old = document.getElementById('printFrame');
    if(old) old.parentNode.removeChild(old);
    var f = document.createElement('iframe');
    f.id = 'printFrame';
    f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
    var done = false;
    function go(){ if(done) return; done = true; try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){} }
    f.onload = function(){ setTimeout(go, 350); };
    document.body.appendChild(f);
    var idoc = f.contentWindow.document;
    idoc.open(); idoc.write(docHtml); idoc.close();
    setTimeout(go, 800); // fallback if onload doesn't fire for written docs
  }

  // Delete button that must be confirmed twice before it actually deletes.
  function wireDelete(btn, ref){
    if(!btn) return;
    var stage = 0, timer = null, orig = btn.textContent;
    function reset(){ stage = 0; btn.textContent = orig; btn.classList.remove('arm'); if(timer){ clearTimeout(timer); timer = null; } }
    btn.addEventListener('click', async function(){
      stage++;
      if(timer) clearTimeout(timer);
      if(stage === 1){ btn.classList.add('arm'); btn.textContent = 'Bekræft slet (1/2)'; timer = setTimeout(reset, 4000); return; }
      if(stage === 2){ btn.textContent = 'Bekræft slet (2/2)'; timer = setTimeout(reset, 4000); return; }
      reset();
      btn.disabled = true; btn.textContent = 'Sletter…';
      try{
        var r = await fetch('/api/fulfill', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'delete', ref: ref }) });
        var d = await r.json().catch(function(){ return {}; });
        if(r.ok && d.ok){ load(); }
        else { alert(d.error || 'Kunne ikke slette'); btn.disabled = false; btn.textContent = orig; }
      }catch(e){ alert('Netværksfejl'); btn.disabled = false; btn.textContent = orig; }
    });
  }

  // If already logged in on /locker, the cookie is set — go straight in.
  load();
})();
</script>
